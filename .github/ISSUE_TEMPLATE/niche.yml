name: Request a job
description: Ask for a map of a job that is not in the library
labels: [niche-request]
body:
  - type: markdown
    attributes:
      value: "Describe the job precisely. The more specific, the better the map. No delivery date is promised. This form is public. Do not include personal or confidential information."
  - type: input
    id: job
    attributes:
      label: Job
      placeholder: payroll specialist
    validations:
      required: true
  - type: input
    id: employer
    attributes:
      label: Kind and size of employer
  - type: input
    id: region
    attributes:
      label: Country or region
  - type: input
    id: tools
    attributes:
      label: Main software they work in
  - type: textarea
    id: building
    attributes:
      label: What are you building? (optional)
